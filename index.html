  <body>
    <div id="root">
      <!-- Pre-React loading state — shown during JS bundle download/parse -->
      <div style="position: fixed; inset: 0; background-color: var(--splash-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; overflow: hidden;">
        <!-- Grid background -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: linear-gradient(var(--splash-grid) 1px, transparent 1px), linear-gradient(90deg, var(--splash-grid) 1px, transparent 1px); background-size: 40px 40px;"></div>
        <!-- Gold glow orb -->
        <div style="position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; background: radial-gradient(circle, var(--splash-orb) 0%, transparent 70%); border-radius: 50%; filter: blur(60px);"></div>

        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px;">
          <!-- Logo with pulsing ring -->
          <div style="position: relative;">
            <div style="position: absolute; inset: -12px; border-radius: 20px; border: 1px solid var(--splash-ring); animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
            <div style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: var(--splash-logo-bg); box-shadow: 0 0 32px -4px var(--splash-glow); border: 1px solid var(--splash-ring);">
              <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; padding: 8px; color: var(--splash-accent); fill: currentColor;">
                <path d="M50 20c-20 0-38 12-45 30 7 18 25 30 45 30s38-12 45-30c-7-18-25-30-45-30zm0 50c-11 0-20-9-20-20s9-20 20-20 20 9 20 20-9 20-20 20z" />
                <path d="M50 35c-8.3 0-15 6.7-15 15s6.7 15 15 15 15-6.7 15-15-6.7-15-15-15zm0 25c-5.5 0-10-4.5-10-10s4.5-10 10-10 10 4.5 10 10-4.5 10-10 10z" />
                <circle cx="50" cy="50" r="4" />
                <path d="M50 15c0-5 5-10 10-10s5 5 5 5-5 5-10 5z" opacity="0.5" />
                <path d="M50 85c0 5-5 10-10 10s-5-5-5-5 5-5 10-5z" opacity="0.5" />
              </svg>
            </div>
          </div>

          <!-- Title -->
          <div style="text-align: center;">
            <div style="font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; letter-spacing: -0.01em; background: linear-gradient(90deg, var(--splash-accent), var(--splash-accent-hi), var(--splash-accent-deep)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">EPIMETHEUS</div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--splash-muted); letter-spacing: 0.25em; text-transform: uppercase; margin-top: 6px;">Initializing System</div>
          </div>

          <div style="width: 200px;">

              <div style="height: 100%; width: 30%; background: linear-gradient(135deg, var(--splash-accent), var(--splash-accent-deep), var(--splash-copper)); border-radius: 9999px; animation: loading-bar 2s ease-in-out infinite;"></div>
