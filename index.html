<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0508" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Epimetheus" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Warm the connection for the Google OAuth redirect chain (Supabase
         /authorize 302s to accounts.google.com). Without this, the account
         chooser waits on a cold DNS+TCP+TLS handshake — noticeable on
         slow mobile networks. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <!-- Preconnect for Google Fonts (display-critical: hero uses Cormorant Garamond) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- PERF-100x: font weights trimmed to verified usage (100x audit):
         Inter 300 unused (no font-light anywhere); Space Grotesk used once
         (ComparePage, font-bold) -> 700 only; Cormorant used as 300 +
         italic 400 (.hero-headline, .hero-headline-italic); JetBrains Mono
         400+500 kept (500 may apply to mono text via parent classes). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap">

    <link rel="canonical" href="https://epimetheusproject.vercel.app/" />
    <title>EPIMETHEUS — Master the Art of Connection</title>
    <meta name="description" content="EPIMETHEUS is premium dating and relationship coaching — personality assessments, an AI advisor, and tactical playbooks for connection." />
    <meta property="og:title" content="EPIMETHEUS — Master the Art of Connection" />
    <meta property="og:description" content="Premium dating and relationship coaching: personality assessments, an AI advisor, and tactical playbooks for connection." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://epimetheusproject.vercel.app/" />
    <meta property="og:site_name" content="Epimetheus" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://epimetheusproject.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EPIMETHEUS — Master the Art of Connection" />
    <meta name="twitter:description" content="Premium dating and relationship coaching: personality assessments, an AI advisor, and tactical playbooks for connection." />
    <meta name="twitter:image" content="https://epimetheusproject.vercel.app/og-image.jpg" />
    <meta name="twitter:site" content="@epimetheus" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Epimetheus" />
    <style>
      /* PERF-100x: pre-React loader matches the logo-only LoadingScreen
         (PR #17). Single centered logo, barely-there breathing animation.
         No rings, titles, progress bars, or status copy. */
      @keyframes logo-breathe {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #pre-react-loader > div { animation: none !important; opacity: 1 !important; }
      }
    </style>
    <!-- Theme init is external (public/theme-init.js) so the static CSP
         in vercel.json stays hash-free under script-src 'self'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React loading state — shown during JS bundle download/parse.
           Logo-only, matching the in-app LoadingScreen (PR #17). -->
      <div id="pre-react-loader" style="position: fixed; inset: 0; background-color: #0E0B12; display: flex; align-items: center; justify-content: center; z-index: 9999;">
        <div style="animation: logo-breathe 2.4s ease-in-out infinite;">
          <div style="width: 48px; height: 48px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #000; border: 1px solid rgba(255,255,255,0.1);">
            <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; padding: 6px; color: #fff; fill: currentColor;" xmlns="http://www.w3.org/2000/svg">
              <path d="M50 20c-20 0-38 12-45 30 7 18 25 30 45 30s38-12 45-30c-7-18-25-30-45-30zm0 50c-11 0-20-9-20-20s9-20 20-20 20 9 20 20-9 20-20 20z" />
              <path d="M50 35c-8.3 0-15 6.7-15 15s6.7 15 15 15 15-6.7 15-15-6.7-15-15-15zm0 25c-5.5 0-10-4.5-10-10s4.5-10 10-10 10 4.5 10 10-4.5 10-10 10z" />
              <circle cx="50" cy="50" r="4" />
              <path d="M50 15c0-5 5-10 10-10s5 5 5 5-5 5-10 5z" opacity="0.5" />
              <path d="M50 85c0 5-5 10-10 10s-5-5-5-5 5-5 10-5z" opacity="0.5" />
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
