name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (frontend + API)
        run: npm run lint:all

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          version="${GITHUB_REF_NAME}"
          (cd dist && zip -qr "../epimetheus-web-${version}.zip" .)
          ls -lh "epimetheus-web-${version}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: epimetheus-web-*.zip
          generate_release_notes: true

      - name: Release summary (mobile-friendly)
        run: |
          {
            echo "## Release ${{ github.ref_name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Tag** | ${{ github.ref_name }} |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Artifact** | epimetheus-web-${{ github.ref_name }}.zip (static PWA build) |"
            echo "| **Tests** | passed |"
            echo "| **Status** | published |"
            echo ""
            echo "Installable PWA - open the deployed URL on a phone and use *Add to Home Screen*."
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: set the RELEASE_WEBHOOK_URL secret (Slack/Discord/other) to enable.
      - name: Notify (optional webhook)
        if: env.RELEASE_WEBHOOK_URL != ''
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          msg="Epimetheus ${{ github.ref_name }} released - ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          curl -sf -X POST "$RELEASE_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"$msg\"}" \
            || echo "::warning::Webhook notification failed (release is still published)"
