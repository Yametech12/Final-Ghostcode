# SEC-11: secret scanning in CI.
#
# - push/PR: scans the changeset (fast, blocks merges on leaks)
# - nightly schedule: scans the FULL git history so a key that slipped in
#   months ago still gets caught and rotated
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-history scan at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for scheduled scans)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The action auto-detects .gitleaks.toml. On scheduled/history runs
        # it scans every commit; on PRs it scans the changeset.
