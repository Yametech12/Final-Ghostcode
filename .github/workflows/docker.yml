name: Docker build & publish

# Separate from ci.yml (S14). This workflow owns the container artifact:
# build -> smoke test inside the image -> publish to GHCR on tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build image & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for the smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ghostcode-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=ghostcode-api
          cache-to: type=gha,mode=max,scope=ghostcode-api

      - name: Smoke test — 5x GET /api/health must return 200
        run: |
          chmod +x scripts/docker-smoke.sh
          scripts/docker-smoke.sh ghostcode-api:ci 5

      - name: Report image size
        run: |
          SIZE=$(docker image inspect ghostcode-api:ci --format '{{.Size}}')
          MB=$(awk -v b="$SIZE" 'BEGIN { printf "%.1f", b/1048576 }')
          echo "### Docker image size: ${MB} MB" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`ghostcode-api:ci\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- smoke: 5/5 \`GET /api/health\` returned 200" >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs on failure
        if: failure()
        run: docker ps -a && docker logs $(docker ps -aq --filter name=ghostcode-smoke | head -1) 2>&1 | tail -50 || true

  publish:
    name: Publish to GHCR
    needs: build-and-smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=ghostcode-api
          cache-to: type=gha,mode=max,scope=ghostcode-api
